<script>
(function(){
  const P=JSON.parse(document.getElementById('payload').textContent);
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function open(pw){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,b(P.c));
    return new TextDecoder().decode(pt);
  }
  function show(html){document.open();document.write(html);document.close();}
  let saved=null; try{saved=sessionStorage.getItem('cs-pw')}catch(e){}
  if(saved){open(saved).then(show).catch(()=>{try{sessionStorage.removeItem('cs-pw')}catch(e){}});}
  document.getElementById('f').addEventListener('submit',async e=>{
    e.preventDefault();
    const pw=document.getElementById('pw').value,err=document.getElementById('err'),btn=e.target.querySelector('button');
    btn.textContent='Unlocking';err.textContent='';
    try{const html=await open(pw);try{sessionStorage.setItem('cs-pw',pw)}catch(e){}show(html);}
    catch(x){err.textContent='That password didn\'t work. Check it and try again.';btn.textContent='Unlock';}
  });
})();
</script>
